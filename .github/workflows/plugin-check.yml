name: Plugin Check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  plugin-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Build release
        run: ./build-release.sh

      - name: Extract release for Plugin Check
        run: |
          mkdir -p build/plugin-check
          unzip -q build/ozeki-database-backup-for-s3-*.zip -d build/plugin-check

      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: ./build/plugin-check/ozeki-database-backup-for-s3