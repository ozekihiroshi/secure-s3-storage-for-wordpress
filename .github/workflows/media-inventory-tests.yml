name: Media Inventory Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  inventory:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint inventory implementation and tests
        run: |
          find src/Backup/Media src/WordPress/WordPressMediaSourceFactory.php -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l tests/manual/test-media-inventory.php
          php -l tests/manual/test-wordpress-media-source.php
          php -l tools/create-media-fixtures.php
          php -l tools/check-media-fixtures.php
      - name: Verify inventory and restored files with bounded memory
        run: php -d memory_limit=32M tests/manual/test-media-inventory.php
      - name: Verify WordPress upload-root resolution
        run: php tests/manual/test-wordpress-media-source.php
      - name: Verify synthetic fixture generator and independent inventory
        run: |
          php -d memory_limit=32M tools/create-media-fixtures.php "$RUNNER_TEMP/odbfs3-media-fixture" --large-mib=8 --small-files=25 --small-bytes=4096
          php -d memory_limit=32M tools/check-media-fixtures.php "$RUNNER_TEMP/odbfs3-media-fixture"
