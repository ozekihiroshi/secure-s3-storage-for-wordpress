name: Backup Job Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  job-state:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint background-job foundation
        run: |
          find src/Backup/Job src/WordPress/WordPressJobStore.php -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l tests/manual/test-backup-job-runner.php
          php -l tests/manual/test-wordpress-job-store.php
          php -l tests/manual/wordpress-job-test-bootstrap.php
      - name: Verify state transitions and worker fencing
        run: php tests/manual/test-backup-job-runner.php
